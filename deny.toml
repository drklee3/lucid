# See https://embarkstudios.github.io/cargo-deny/ for the full schema — this
# only overrides fields that differ from cargo-deny's defaults.

[advisories]
# Defaults (db-path/db-urls) are fine; nothing to override yet.

[licenses]
# SPDX ids actually present across the dependency tree, confirmed via
# `cargo deny check` — expand this when a new dependency needs a license not
# already covered.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Unlicense",
    "MIT-0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "Zlib",
]

[licenses.private]
# `lucid` itself has no license field (see `publish = false` in Cargo.toml —
# it's not going to crates.io), so treat it as an unpublished workspace crate
# rather than tripping the unlicensed check.
ignore = true

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
