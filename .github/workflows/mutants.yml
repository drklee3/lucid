name: Mutation testing

on:
  workflow_dispatch:
  schedule:
    # Weekly, not per-push — a full cargo-mutants run rebuilds+retests per
    # mutant and is too slow to gate every push.
    - cron: "0 6 * * 1"

permissions: {}

jobs:
  mutants:
    name: cargo-mutants (full run)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: cargo install cargo-mutants
        run: cargo install --locked cargo-mutants
      - name: cargo mutants
        run: cargo mutants --no-shuffle --in-place
      - name: upload mutants.out
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutants.out
          path: mutants.out
